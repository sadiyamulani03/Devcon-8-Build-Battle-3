[profile.default]
src = "contracts"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.27"
optimizer = true
optimizer_runs = 200
via_ir = false
ffi = false

remappings = [
  "@semaphore=lib/semaphore",
  "@zk-kit/lean-imt.sol=node_modules/@zk-kit/lean-imt.sol",
  "poseidon-solidity=lib/poseidon-solidity"
]

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = true
int_types = "long"
quote_style = "double"
